<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Kasir POS Sederhana</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-4">
        <h1 class="mb-4 text-center">Aplikasi Kasir POS Sederhana</h1>

       
        <div class="row text-center mb-4">
            <div class="col-md-4 mb-2">
                <div class="card p-3 shadow-sm">
                    <h5>Total Omzet</h5>
                    <h3 id="metric-omzet">Rp 0</h3>
                </div>
            </div>
            <div class="col-md-4 mb-2">
                <div class="card p-3 shadow-sm">
                    <h5>Total Transaksi</h5>
                    <h3 id="metric-transaksi">0</h3>
                </div>
            </div>
            <div class="col-md-4 mb-2">
                <div class="card p-3 shadow-sm">
                    <h5>Sisa Stok Barang</h5>
                    <h3 id="metric-stok">0</h3>
                </div>
            </div>
        </div>

        <div class="row">
         
            <div class="col-lg-7 mb-4">
                <!-- Form Tambah Produk Baru -->
                <div class="card shadow-sm p-3 mb-3">
                    <h4 class="mb-3">Tambah Produk Baru</h4>
                    <form id="add-product-form">
                        <div class="mb-2">
                            <label class="form-label">Nama Produk</label>
                            <input type="text" id="new-product-name" class="form-control" placeholder="Contoh: Kotak Pensil Anak" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Harga (Rp)</label>
                            <input type="number" id="new-product-price" class="form-control" placeholder="Contoh: 5000" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Stok Awal</label>
                            <input type="number" id="new-product-stock" class="form-control" placeholder="Contoh: 10" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Simpan Produk</button>
                    </form>
                </div>

                <div class="card shadow-sm p-3">
                    <h4 class="mb-3">Daftar Produk</h4>
                    <div class="table-responsive">
                        <table class="table table-bordered align-middle">
                            <thead>
                                <tr>
                                    <th>Nama</th>
                                    <th>Harga</th>
                                    <th>Stok</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="product-list">
                               
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

  
            <div class="col-lg-5 mb-4">
                <div class="card shadow-sm p-3">
                    <h4 class="mb-3">Keranjang Belanja</h4>
                    <div class="table-responsive">
                        <table class="table table-sm align-middle">
                            <thead>
                                <tr>
                                    <th>Item</th>
                                    <th>Qty</th>
                                    <th>Subtotal</th>
                                    <th>#</th>
                                </tr>
                            </thead>
                            <tbody id="cart-list">
                              
                            </tbody>
                        </table>
                    </div>
                    <hr>
                    <h5>Total: <span id="cart-total">Rp 0</span></h5>
                    
                    <div class="mb-3 mt-3">
                        <label class="form-label">Metode Pembayaran</label>
                        <select id="payment-method" class="form-select">
                            <option value="Tunai">Tunai</option>
                            <option value="QRIS">QRIS</option>
                            <option value="Transfer">Transfer</option>
                        </select>
                    </div>

                    <div class="mb-3" id="cash-input-container">
                        <label class="form-label">Jumlah Uang Tunai</label>
                        <input type="number" id="cash-given" class="form-control" placeholder="Masukkan nominal uang">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Kembalian: <strong id="change-amount">Rp 0</strong></label>
                    </div>

                    <button class="btn btn-success w-100 mb-2" id="checkout-btn">Bayar & Cetak Nota</button>
                    <button class="btn btn-outline-secondary w-100" id="reset-cart-btn">Kosongkan Keranjang</button>
                </div>
            </div>
        </div>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
